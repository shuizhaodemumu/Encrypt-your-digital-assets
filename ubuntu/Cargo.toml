[package]
name = "encrypt-assets-ubuntu"
version = "0.1.0"
edition = "2021"
description = "Offline encrypted content packaging and licensing for Ubuntu"

[features]
watchdog-test-mode = []

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "ecdh"] }
rsa = { version = "0.9", features = ["sha2"] }
hkdf = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
md-5 = "0.10"
rand = "0.8"
uuid = { version = "1.0", features = ["serde", "v4"] }
pkcs8 = { version = "0.10", features = ["encryption", "std"] }
pkcs5 = { version = "0.7", features = ["pbes2", "alloc"] }
zeroize = { version = "1.8", features = ["derive"] }
libloading = "0.8"
libc = "0.2"
gtk = { package = "gtk4", version = "0.9", features = ["v4_8"] }
tempfile = "3"
encoding_rs = "0.8"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

