[package]
name = "online-license"
version = "0.1.0"
edition = "2021"
license = "MIT"
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Security_Cryptography"] }
