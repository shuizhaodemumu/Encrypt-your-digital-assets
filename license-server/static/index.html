<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线授权管理</title><style>
:root{font:16px system-ui;color:#39274f;background:#f5f1fa}body{margin:0}header{padding:28px 5vw;background:linear-gradient(110deg,#e5dbf4,#faf7ff);border-bottom:1px solid #ded2ea}h1{margin:0;font-size:28px}small{color:#786788}main{max-width:1200px;margin:28px auto;padding:0 24px}.card{background:white;border:1px solid #e4d9ee;border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 8px 24px #6b408008}button,input,select{font:inherit;border:1px solid #d7c4e7;border-radius:9px;padding:10px 14px;margin:4px}button{background:#8058a3;color:white;cursor:pointer}button.secondary{background:#f3edf8;color:#674482}button.danger{background:#a04464}input{max-width:90%}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;border-bottom:1px solid #eee6f5;padding:12px 8px;word-break:break-word}nav{display:flex;gap:6px;flex-wrap:wrap}.row{display:flex;gap:16px}.row>section{flex:1}.error{color:#a12b45;white-space:pre-wrap}.badge{background:#eee5f6;padding:4px 9px;border-radius:20px}#key{word-break:break-all;font-size:12px} .scroll{overflow:auto}@media(max-width:700px){.row{display:block}td,th{min-width:110px}}
</style><header><h1>Encrypt your digital assets</h1><p>在线授权管理 · NAS</p><small>本地签发 LIC，这里统一管理组、内容和设备。</small></header><main>
<section class="card" id="login"><h2>连接管理器</h2><input id="token" type="password" autocomplete="off" placeholder="管理员访问令牌"><button id="connect">连接</button><small>令牌仅保留在当前页面内存，关闭页面即清除。</small></section>
<div id="app" hidden><nav><button data-tab="groups">组管理</button><button data-tab="contents">内容管理</button><button data-tab="licenses">设备与授权</button><button data-tab="audit">操作记录</button><button id="refresh" class="secondary">刷新</button><button id="logout" class="secondary">退出</button></nav>
<section class="card"><label>当前组 <select id="group"><option value="">全部组</option></select></label><label>平台 <select id="platform"><option value="">全部平台</option><option>Windows</option><option>Linux</option><option>Android</option></select></label><p id="summary"></p></section>
<section class="card" id="create"><h2>创建组</h2><input id="name" maxlength="80" placeholder="例如：客户 A 展厅"><input id="note" maxlength="500" placeholder="备注（可选）"><button id="createGroup">创建组</button></section>
<section class="card scroll"><h2 id="heading">组管理</h2><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></section>
<details class="card"><summary>本地打包工具连接信息</summary><p>服务器地址：<span id="url"></span></p><p>固定验证公钥（配置客户端时核对）：</p><code id="key"></code><p>管理员令牌只配置在管理员电脑，不写入分发给用户的内容程序。</p></details></div><p class="error" id="error" role="alert"></p></main>
<script>
'use strict';let token='',data={},tab='groups',sample=0;const $=id=>document.getElementById(id);const text=(tag,s)=>{let e=document.createElement(tag);e.textContent=String(s??'');return e};
async function api(v){let r=await fetch('/api/admin',{method:v?'POST':'GET',headers:{Authorization:'Bearer '+token,...(v?{'Content-Type':'application/json'}:{})},body:v?JSON.stringify(v):undefined,cache:'no-store'});let j=await r.json();if(!r.ok)throw Error(j.error||'连接失败');return j}
async function run(fn){$('error').textContent='';try{await fn()}catch(e){$('error').textContent=e.message}}
async function refresh(){data=await api();sample=performance.now();let selected=$('group').value;$('group').replaceChildren(new Option('全部组',''),...data.groups.map(g=>new Option(g.name+(g.enabled?'':'（已暂停）'),g.id)));$('group').value=selected;$('key').textContent=data.server_key;$('url').textContent=location.origin;$('summary').textContent=`${data.groups.length} 个组 · ${data.contents.length} 个内容 · 最近 ${data.licenses.length} 份授权`;render()}
function remaining(end){const minutes=Math.ceil((end-data.server_time-(performance.now()-sample)/1000)/60);if(minutes<=0)return '已到期';return '剩余 '+Math.floor(minutes/1440)+' 天 '+Math.floor(minutes%1440/60)+' 小时 '+minutes%60+' 分钟'}
function render(){let group=$('group').value,platform=$('platform').value;let contents=data.contents.filter(c=>(!group||c.group_id===group)&&(!platform||c.platform===platform));let ids=new Set(contents.map(c=>c.id));let rows=tab==='groups'?data.groups.filter(g=>!group||g.id===group):tab==='contents'?contents:tab==='licenses'?data.licenses.filter(l=>ids.has(l.content_id)):data.audit;let labels={groups:['组名称','备注','状态','操作'],contents:['内容名称','平台 / 组','状态','操作'],licenses:['设备名称 / 授权编号','内容 / 到期时间 / 剩余期限','最近连接 / 状态','操作'],audit:['时间','操作','目标']};$('heading').textContent={groups:'组管理',contents:'内容管理',licenses:'设备与授权',audit:'最近操作记录'}[tab];$('create').hidden=tab!=='groups';let head=document.createElement('tr');labels[tab].forEach(s=>head.append(text('th',s)));$('thead').replaceChildren(head);$('tbody').replaceChildren();for(let r of rows){let tr=document.createElement('tr');let dt=n=>new Date(n*1000).toLocaleString();let cols=tab==='groups'?[r.name,r.note,r.enabled?'正常':'已暂停']:tab==='contents'?[r.name,r.platform+' / '+(data.groups.find(g=>g.id===r.group_id)?.name||''),r.enabled?'允许（仍受组限制）':'已暂停']:tab==='licenses'?[(r.device_name||'尚未上报名称')+' / '+r.device+' / '+r.id,(data.contents.find(c=>c.id===r.content_id)?.name||'')+' / '+dt(r.expires)+' / '+remaining(r.expires),dt(r.last_seen)+' / '+(r.enabled?'允许（仍受上级限制）':'已撤销')]:[dt(r.time),r.action,r.target];cols.forEach(s=>tr.append(text('td',s)));if(tab!=='audit'){let td=document.createElement('td'),button=text('button',r.enabled?'暂停授权':'恢复授权');button.className=r.enabled?'danger':'secondary';button.onclick=()=>run(async()=>{let scope={groups:'group',contents:'content',licenses:'license'}[tab];if(!confirm(`${r.enabled?'暂停':'恢复'} ${r.name||r.id}？\n暂停后客户端在下一次验证时停止，断网时最迟在 120 秒许可到期后停止。整组操作影响组内全部内容。`))return;await api({op:'set_enabled',scope,id:r.id,enabled:!r.enabled});await refresh()});td.append(button);if(tab==='groups'){let del=text('button','删除组');del.className='danger';del.disabled=data.contents.some(c=>c.group_id===r.id);del.title=del.disabled?'组内已有内容，可暂停授权':'删除空组';del.onclick=()=>run(async()=>{if(confirm('永久删除空组「'+r.name+'」？')){await api({op:'delete_group',id:r.id});await refresh()}});td.append(del)}tr.append(td)}$('tbody').append(tr)}if(!rows.length){let tr=document.createElement('tr'),td=text('td',({groups:'暂无组。',contents:'暂无已登记内容。请在 Windows 工作台选组并保存后重新打包。',licenses:'暂无激活记录。设备首次导入联网 LIC 并成功连接后显示在这里。',audit:'暂无操作记录。'})[tab]);td.colSpan=4;tr.append(td);$('tbody').append(tr)}}
$('connect').onclick=()=>run(async()=>{token=$('token').value.trim();await refresh();$('token').value='';$('login').hidden=true;$('app').hidden=false});$('logout').onclick=()=>{token='';data={};$('app').hidden=true;$('login').hidden=false;$('tbody').replaceChildren()};$('refresh').onclick=()=>run(refresh);$('group').onchange=$('platform').onchange=render;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();run(refresh)});$('createGroup').onclick=()=>run(async()=>{let r=await api({op:'create_group',name:$('name').value,note:$('note').value});$('name').value='';$('note').value='';await refresh();$('group').value=r.id;render()});
setInterval(()=>{if(token && tab==="licenses" && data.licenses)render()},30000);
</script></html>
